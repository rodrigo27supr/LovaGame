name: Buscador de Ofertas LovaGame

on:
  workflow_dispatch: # Permite lanzarlo a mano
  schedule:
    - cron: '5 * * * *' # Minuto 5 de cada hora (GitHub puede retrasarlo o saltarse alguna)

permissions:
  contents: write # Para guardar el historial
  actions: write  # Para mantener activo el horario (último paso)

# Nunca dos ejecuciones a la vez: se pisarían el historial.
concurrency:
  group: lovagame
  cancel-in-progress: false

jobs:
  buscar-juegos:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      # El historial de avisos vive en la rama "historial", así los commits
      # automáticos del bot no se mezclan con los míos en main.
      - name: Descargar el historial
        uses: actions/checkout@v5
        with:
          ref: historial
          path: estado

      - name: Instalar Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven' # Guarda las dependencias entre ejecuciones

      - name: Ejecutar LovaGame
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: "@lovagame_rodrigo"
          HISTORIAL_PATH: estado/historial.txt
        run: mvn --batch-mode --quiet compile exec:java

      - name: Guardar el historial
        if: always()
        working-directory: estado
        run: |
          git config user.name 'LovaGame Bot'
          git config user.email 'bot@noreply.github.com'
          git add historial.txt
          # Solo hay commit si han entrado IDs nuevos
          if git diff --staged --quiet; then
            echo "Sin cambios en el historial."
          else
            git commit -m "Actualizar historial"
            git push
          fi

      # GitHub desactiva los horarios de los repos públicos tras 60 días sin
      # actividad. Como el bot ya no hace commits en main, lo reactivo por la API.
      - name: Mantener activo el horario
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/ejecutar.yml/enable"
